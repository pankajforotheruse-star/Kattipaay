name: Godot 4.4 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  godot-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.4 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64

      - name: Verify Godot version
        run: |
          ./Godot_v4.4-stable_linux.x86_64 --version

      - name: Import project
        run: |
          ./Godot_v4.4-stable_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Run game startup smoke test
        run: |
          rm -f godot-runtime.log

          ./Godot_v4.4-stable_linux.x86_64 \
            --headless \
            --path . \
            --verbose \
            --log-file godot-runtime.log &
          GODOT_PID=$!

          echo "Waiting for the game to reach MAIN_MENU..."
          for i in $(seq 1 30); do
            if grep -q "GameState: SPLASH → MAIN_MENU" godot-runtime.log 2>/dev/null; then
              echo "Startup milestone reached: MAIN_MENU"
              sleep 2
              kill "$GODOT_PID" 2>/dev/null || true
              wait "$GODOT_PID" 2>/dev/null || true
              break
            fi

            if ! kill -0 "$GODOT_PID" 2>/dev/null; then
              echo "Godot exited before reaching MAIN_MENU."
              cat godot-runtime.log || true
              exit 1
            fi

            sleep 1
          done

          if ! grep -q "GameState: SPLASH → MAIN_MENU" godot-runtime.log 2>/dev/null; then
            echo "Godot did not reach MAIN_MENU within 30 seconds."
            cat godot-runtime.log || true
            kill "$GODOT_PID" 2>/dev/null || true
            wait "$GODOT_PID" 2>/dev/null || true
            exit 1
          fi

          echo "Checking runtime log for fatal startup errors..."
          if grep -E -q "SCRIPT ERROR|Parse Error|FATAL|Fatal|Terminating|engine abort|Segmentation fault" godot-runtime.log; then
            echo "Fatal/script startup error detected."
            cat godot-runtime.log
            exit 1
          fi

          echo "Godot runtime startup smoke test PASSED."

      - name: Upload Godot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-log
          path: godot-runtime.log
          if-no-files-found: ignore
