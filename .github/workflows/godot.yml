name: Godot 4.4 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  godot-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.4 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64

      - name: Verify Godot version
        run: |
          ./Godot_v4.4-stable_linux.x86_64 --version

      - name: Import project
        run: |
          ./Godot_v4.4-stable_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Run Kattipaay Playable Smoke Test
        run: |
          rm -f godot-playable-smoke.log

          echo "Running end-to-end Kattipaay Playable Smoke Test..."
          set +e
          timeout 90s ./Godot_v4.4-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://scripts/tests/KattipaayPlayableSmokeTest.gd \
            --verbose \
            --log-file godot-playable-smoke.log
          GODOT_EXIT=$?
          set -e

          echo "Godot smoke-test process exit code: $GODOT_EXIT"

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Kattipaay Playable Smoke Test process failed."
            cat godot-playable-smoke.log || true
            exit 1
          fi

          if ! grep -q "KATTIPAAY_SMOKE: PASS" godot-playable-smoke.log; then
            echo "Smoke-test PASS marker was not found."
            cat godot-playable-smoke.log || true
            exit 1
          fi

          echo "Checking playable smoke-test log for runtime/script errors..."
          if grep -E -q "KATTIPAAY_SMOKE: FAIL|SCRIPT ERROR|Parse Error|FATAL|Terminating|Segmentation fault|ERROR:" godot-playable-smoke.log; then
            echo "Runtime/script error detected during playable smoke test."
            cat godot-playable-smoke.log
            exit 1
          fi

          echo "Kattipaay Playable Smoke Test PASSED."

      - name: Upload playable smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-playable-smoke-log
          path: godot-playable-smoke.log
          if-no-files-found: ignore
