name: Godot 4.4 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  godot-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.4 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64

      - name: Verify Godot version
        run: |
          ./Godot_v4.4-stable_linux.x86_64 --version

      - name: Import project
        run: |
          ./Godot_v4.4-stable_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Run game
        run: |
          timeout 60s ./Godot_v4.4-stable_linux.x86_64 \
            --headless \
            --path . \
            --verbose \
            --log-file godot-runtime.log
        continue-on-error: true

      - name: Upload Godot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-log
          path: godot-runtime.log
          if-no-files-found: ignore
