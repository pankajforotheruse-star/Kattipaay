name: Village Graybox - Godot 4.4

on:
  push:
    branches: [feature/3d-village-graybox, feature/chalk-gaon-3d-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graybox:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot 4.4 stable
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x ./Godot_v4.4-stable_linux.x86_64
          ./Godot_v4.4-stable_linux.x86_64 --version
      - name: Validate Android QA build harness and playtest analyzer
        run: |
          set -euo pipefail
          bash -n scripts/android_3d_qa.sh
          python3 -m py_compile scripts/analyze_3d_playtests.py
      - name: Parse and import all scenes
        run: |
          set -euo pipefail
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --editor --quit --log-file graybox-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' graybox-import.log
      - name: Graybox structure smoke
        run: |
          set -euo pipefail
          timeout 60s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/VillageGrayboxSmokeTest.gd --log-file graybox-smoke.log
          grep -q 'GRAYBOX AUTOMATED STRUCTURE CHECK PASS' graybox-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' graybox-smoke.log
      - name: 3D stroke and territory logic regression
        run: |
          set -euo pipefail
          timeout 60s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DMigrationTest.gd --log-file 3d-migration-smoke.log
          grep -q 'CHALK_GAON_3D: PASS' 3d-migration-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-migration-smoke.log
      - name: 3D user playtest regression (CPU strike, draw, coin, result)
        run: |
          set -euo pipefail
          timeout 100s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DPlaytestRegression.gd --log-file 3d-playtest-regression.log
          grep -q 'CHALK_GAON_3D_PLAYTEST_REGRESSION: PASS' 3d-playtest-regression.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-playtest-regression.log
      - name: Segment visibility and 300-mark stress acceptance
        run: |
          set -euo pipefail
          timeout 110s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DVisibilityStress.gd --log-file 3d-visibility-stress.log
          grep -q 'CHALK_GAON_3D_VISIBILITY_STRESS: PASS' 3d-visibility-stress.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-visibility-stress.log
      - name: Rooftop search and defender authority acceptance
        run: |
          set -euo pipefail
          timeout 110s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DNavigationAuthority.gd --log-file 3d-navigation-authority.log
          grep -q 'CHALK_GAON_3D_NAV_AUTHORITY: PASS' 3d-navigation-authority.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-navigation-authority.log
      - name: Owner parity regression (score, coin, quota, cheating)
        run: |
          set -euo pipefail
          timeout 80s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DParity.gd --log-file 3d-parity.log
          grep -q 'CHALK_GAON_3D_PARITY: PASS' 3d-parity.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-parity.log
      - name: Physical cover and isolated result persistence
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DPersistenceCover.gd --log-file 3d-persistence-cover.log
          grep -q 'CHALK_GAON_3D_PERSISTENCE_COVER: PASS' 3d-persistence-cover.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-persistence-cover.log
      - name: Simulated Android touch arbitration
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DTouchArbitration.gd --log-file 3d-touch-arbitration.log
          grep -q 'CHALK_GAON_3D_TOUCH_ARBITRATION: PASS' 3d-touch-arbitration.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-touch-arbitration.log
      - name: Host-authoritative 3D action and replay defense contract
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DAuthorityQA.gd --log-file 3d-authority-qa.log
          grep -q 'CHALK_GAON_3D_AUTHORITY: PASS' 3d-authority-qa.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-authority-qa.log
      - name: Shared 2D-3D rules, multilevel navigation and physical cover parity
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DParityHardening.gd --log-file 3d-parity-hardening.log
          grep -q 'CHALK_GAON_3D_PARITY_HARDENING: PASS' 3d-parity-hardening.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-parity-hardening.log
      - name: Original village art, spatial audio and animation presentation QA
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DProductionPresentation.gd --log-file 3d-production-presentation.log
          grep -q 'CHALK_GAON_3D_PRODUCTION_PRESENTATION: PASS' 3d-production-presentation.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-production-presentation.log
      - name: 3D statistics and Android profiling export acceptance
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DAnalyticsQA.gd --log-file 3d-analytics-qa.log
          grep -q 'CHALK_GAON_3D_ANALYTICS_QA: PASS' 3d-analytics-qa.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-analytics-qa.log
      - name: Scripted physical 3D match batch harness smoke
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.4-stable_linux.x86_64 --headless --fixed-fps 60 --path . --script res://scripts/tests/ChalkGaon3DScriptedMatchBatch.gd --log-file 3d-scripted-batch.log -- --rounds=1 --difficulty=1 --fast
          grep -q 'CHALK_GAON_3D_SCRIPTED_MATCH_BATCH: PASS' 3d-scripted-batch.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-scripted-batch.log
      - name: CPU physical chalk balance benchmark
        continue-on-error: true
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DCpuBalance.gd --log-file 3d-balance.log
          grep -q 'CHALK_GAON_3D_BALANCE_DIAGNOSTIC: PASS' 3d-balance.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-balance.log
      - name: Physical rooftop traversal (four houses)
        run: |
          set -euo pipefail
          timeout 145s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DRoofPhysics.gd --log-file 3d-roof-physics.log
          grep -q 'CHALK_GAON_3D_ROOFS: PASS' 3d-roof-physics.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-roof-physics.log
      - name: Live CPU controller physically ascends and descends rooftop
        run: |
          set -euo pipefail
          timeout 125s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DCpuRoofMotion.gd --log-file 3d-cpu-roof-motion.log
          grep -q 'CHALK_GAON_3D_CPU_ROOF_MOTION: PASS' 3d-cpu-roof-motion.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-cpu-roof-motion.log
      - name: Independent 3D round state smoke
        run: |
          set -euo pipefail
          timeout 100s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DRoundSmoke.gd --log-file 3d-round.log
          grep -q 'CHALK_GAON_3D_ROUND: PASS' 3d-round.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-round.log
      - name: Accelerated full 3D gameplay cycle
        run: |
          set -euo pipefail
          timeout 110s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/ChalkGaon3DE2E.gd --log-file 3d-end-to-end.log
          grep -q 'CHALK_GAON_3D_E2E: PASS' 3d-end-to-end.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-end-to-end.log
      - name: Existing Play vs CPU regression
        run: |
          set -euo pipefail
          timeout 240s ./Godot_v4.4-stable_linux.x86_64 --headless --path . --script res://scripts/tests/KattipaayPlayableSmokeTest.gd --log-file original-smoke.log
          grep -q 'KATTIPAAY_SMOKE: PASS' original-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' original-smoke.log
      - name: Gate CPU physical movement and placement diagnostic
        run: |
          test -f 3d-balance.log
          grep -q 'CHALK_GAON_3D_BALANCE_DIAGNOSTIC: PASS' 3d-balance.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FATAL|Segmentation fault' 3d-balance.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-graybox-test-logs
          path: |
            graybox-import.log
            graybox-smoke.log
            original-smoke.log
            3d-migration-smoke.log
            3d-roof-physics.log
            3d-cpu-roof-motion.log
            3d-balance.log
            3d-parity.log
            3d-playtest-regression.log
            3d-visibility-stress.log
            3d-navigation-authority.log
            3d-touch-arbitration.log
            3d-analytics-qa.log
            3d-production-presentation.log
            3d-parity-hardening.log
            3d-authority-qa.log
            3d-scripted-batch.log
            3d-persistence-cover.log
            3d-round.log
            3d-end-to-end.log
          if-no-files-found: ignore
